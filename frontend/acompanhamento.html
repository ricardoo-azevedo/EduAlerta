<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Acompanhamentos | EduAlerta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body hidden>
    <div id="cabecalho"></div>
    <div id="navegacao"></div>

    <main class="container page-shell">
        <section id="acompanhamentos">
            <div class="page-heading">
                <h2><i class="bi bi-clipboard-heart me-2"></i>Acompanhamentos</h2>
                <p>Registre intervenções realizadas pela secretaria em resposta aos alertas.</p>
            </div>

            <div class="status-note">
                <i class="bi bi-plug me-2"></i>
                Interface preparada para integração. Dados reais dependem dos endpoints da API.
            </div>

            <div class="card">
                <div class="card-body">
                    <h3 class="h5 fw-bold mb-3">Intervenções e notificações</h3>
                    <div class="empty-state">
                        <i class="bi bi-clipboard-heart fs-2 d-block mb-3"></i>
                        Intervenções e notificações serão integradas à API.
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/layout.js"></script>
</body>
</html>
