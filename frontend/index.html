<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | EduAlerta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="login-page">
    <main class="card login-card">
        <div class="login-icon">
            <i class="bi bi-mortarboard-fill"></i>
        </div>

        <div class="login-brand">EduAlerta</div>
        <p class="login-subtitle mt-2 mb-4">Monitoramento de frequência escolar</p>

        <h1 class="h4 fw-bold mb-2">Acesso à secretaria</h1>
        <p class="login-subtitle mb-4">Entre com suas credenciais institucionais.</p>

        <form id="formLogin">
            <div class="mb-3">
                <label for="email" class="form-label">E-mail</label>
                <input id="email" class="form-control" type="email" autocomplete="username" required placeholder="seuemail@instituicao.com">
            </div>

            <div class="mb-4">
                <label for="senha" class="form-label">Senha</label>
                <input id="senha" class="form-control" type="password" autocomplete="current-password" required placeholder="Digite sua senha">
            </div>

            <p id="mensagemLogin" class="login-error" role="alert" aria-live="polite"></p>

            <button id="entrar" type="submit" class="btn btn-primary w-100">
                <i class="bi bi-box-arrow-in-right me-2"></i>Entrar no sistema
            </button>
        </form>

        <p class="small text-muted text-center mt-4 mb-0">
            <i class="bi bi-shield-lock me-1"></i>Acesso restrito a usuários autorizados.
        </p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
