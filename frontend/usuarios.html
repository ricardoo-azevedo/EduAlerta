<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Usuários | EduAlerta</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body hidden>
  <div id="cabecalho"></div>
  <div id="navegacao"></div>
  <main class="container page-shell">
    <section id="usuarios">
      <div class="page-heading">
        <h2><i class="bi bi-person-gear me-2"></i>Usuários do EduAlerta</h2>
        <p>Consulte usuários autorizados e, conforme seu perfil, gerencie contas de secretaria.</p>
      </div>
      <div id="areaCadastro" class="card mb-4" hidden>
        <div class="card-body">
          <h3 class="h5 fw-bold mb-3"><i class="bi bi-person-plus me-2"></i>Cadastrar nova secretaria</h3>
          <p class="text-secondary mb-4">Informe o nome e e-mail institucional. Uma senha temporária será enviada por e-mail.</p>
          <form id="formCadastroUsuario">
            <div class="row g-3">
              <div class="col-md-6">
                <label for="nomeUsuario" class="form-label">Nome completo</label>
                <input id="nomeUsuario" class="form-control" maxlength="150" required placeholder="Digite o nome completo">
              </div>
              <div class="col-md-6">
                <label for="emailUsuario" class="form-label">E-mail</label>
                <input id="emailUsuario" type="email" class="form-control" maxlength="254" required placeholder="secretaria@instituicao.com">
              </div>
            </div>
            <div id="mensagemCadastro" class="mt-3" role="status" aria-live="polite"></div>
            <button id="btnCadastrarUsuario" type="submit" class="btn btn-primary mt-3">Cadastrar secretaria</button>
          </form>
        </div>
      </div>
      <div class="card"><div class="card-body">
        <div class="d-flex align-items-center justify-content-between flex-wrap gap-3 mb-3">
          <h3 class="h5 fw-bold mb-0"><i class="bi bi-people me-2"></i>Usuários cadastrados</h3>
          <button id="btnAtualizarUsuarios" type="button" class="btn btn-outline-primary btn-sm">Atualizar</button>
        </div>
        <form id="formBuscaUsuario" class="row g-2 mb-3">
          <div class="col-md-8">
            <label for="buscaUsuario" class="form-label">Pesquisar por nome</label>
            <input id="buscaUsuario" class="form-control" type="search" placeholder="Digite parte do nome">
          </div>
          <div class="col-md-4 d-flex align-items-end gap-2">
            <button type="submit" class="btn btn-primary">Buscar</button>
            <button id="limparBuscaUsuario" type="button" class="btn btn-outline-secondary">Limpar</button>
          </div>
        </form>
        <div id="mensagemLista" class="mb-3" role="status" aria-live="polite"></div>
        <div class="table-responsive"><table class="table align-middle">
          <thead><tr>
            <th>Nome</th><th>E-mail</th><th>Perfil</th><th>Status</th><th>Senha</th><th id="cabecalhoAcoes">Ações</th>
          </tr></thead>
          <tbody id="listaUsuarios"><tr><td colspan="6" class="text-center">Carregando usuários...</td></tr></tbody>
        </table></div>
      </div></div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/usuarios.js"></script>
</body>
</html>
