<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Encaminhamentos | EduAlerta</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>

<body hidden>
  <div id="cabecalho"></div>
  <div id="navegacao"></div>
  <main class="container page-shell">
    <section>
      <div class="page-heading">
        <h2><i class="bi bi-send-check me-2"></i>Encaminhamentos</h2>
        <p>Registre e acompanhe os encaminhamentos relacionados aos alertas de frequência.</p>
      </div>
      <div id="mensagemEncaminhamentos" role="status" aria-live="polite"></div>
      <div class="card mb-4">
        <div class="card-body">
          <div class="row g-3">
            <div class="col-md-4"><label class="form-label" for="filtroSituacaoAlerta">Situação</label><select
                id="filtroSituacaoAlerta" class="form-select">
                <option value="">Todos</option>
                <option value="ATIVO">Ativos</option>
                <option value="RESOLVIDO">Resolvidos</option>
              </select></div>
            <div class="col-md-8"><label class="form-label" for="selecaoAlerta">Alerta</label><select id="selecaoAlerta"
                class="form-select">
                <option value="">Carregando...</option>
              </select></div>
          </div>
          <div id="detalhesAlerta" class="mt-3 text-secondary"></div>
        </div>
      </div>
      <div class="card mb-4">
        <div class="card-body">
          <h3 class="h5 fw-bold mb-3">Novo encaminhamento</h3>
          <form id="formEncaminhamento" class="row g-3">
            <div class="col-md-6"><label class="form-label" for="servicoDestino">Serviço / instituição de
                destino</label><input id="servicoDestino" class="form-control" maxlength="150" required></div>
            <div class="col-md-6"><label class="form-label" for="finalidade">Finalidade</label><input id="finalidade"
                class="form-control" maxlength="150" required></div>
            <div class="col-md-4"><label class="form-label" for="dataEncaminhamento">Data</label><input
                id="dataEncaminhamento" type="date" class="form-control"></div>
            <div class="col-md-8"><label class="form-label" for="observacao">Observação</label><textarea id="observacao"
                class="form-control" maxlength="1000" rows="2" required></textarea></div>
            <div class="col-12"><button id="salvarEncaminhamento" class="btn btn-primary" type="submit">Registrar
                encaminhamento</button></div>
          </form>
        </div>
      </div>
      <div class="card">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="h5 fw-bold mb-0">Histórico</h3><button id="atualizarEncaminhamentos"
              class="btn btn-outline-primary btn-sm" type="button">Atualizar</button>
          </div>
          <div class="table-responsive">
            <table class="table align-middle">
              <thead>
                <tr>
                  <th>Data</th>
                  <th>Destino</th>
                  <th>Finalidade</th>
                  <th>Observação</th>
                  <th>Situação</th>
                  <th>Ação</th>
                </tr>
              </thead>
              <tbody id="listaEncaminhamentos">
                <tr>
                  <td colspan="6" class="text-center">Selecione um alerta.</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/encaminhamentos.js"></script>
</body>

</html>
