<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notificações | EduAlerta</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>

<body hidden>
  <div id="cabecalho"></div>
  <div id="navegacao"></div>
  <main class="container page-shell">
    <section>
      <div class="page-heading">
        <h2><i class="bi bi-envelope me-2"></i>Notificações por e-mail</h2>
        <p>Consulte o histórico de e-mails enviados aos responsáveis e tente novamente os envios que falharam.</p>
      </div>
      <div id="mensagemNotificacoes" role="status" aria-live="polite"></div>
      <div class="card mb-4">
        <div class="card-body">
          <div class="row g-3">
            <div class="col-md-4"><label class="form-label" for="filtroSituacao">Situação do alerta</label><select
                id="filtroSituacao" class="form-select">
                <option value="">Todos</option>
                <option value="ATIVO">Ativos</option>
                <option value="RESOLVIDO">Resolvidos</option>
              </select></div>
            <div class="col-md-8"><label class="form-label" for="selecaoAlerta">Alerta</label><select id="selecaoAlerta"
                class="form-select">
                <option value="">Selecione um alerta</option>
              </select></div>
          </div>
        </div>
      </div>
      <div class="card">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="h5 fw-bold mb-0">Histórico de envios</h3><button id="atualizarNotificacoes"
              class="btn btn-outline-primary btn-sm" type="button">Atualizar</button>
          </div>
          <div class="table-responsive">
            <table class="table align-middle">
              <thead>
                <tr>
                  <th>Responsável</th>
                  <th>Destinatário</th>
                  <th>Situação</th>
                  <th>Criada em</th>
                  <th>Enviada em</th>
                  <th>Detalhe / ação</th>
                </tr>
              </thead>
              <tbody id="listaNotificacoes">
                <tr>
                  <td colspan="6" class="text-center">Selecione um alerta.</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/notificacoes.js"></script>
</body>

</html>
