<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Painel | EduAlerta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
</head>
<body hidden>
    <div id="cabecalho"></div>
    <div id="navegacao"></div>

    <main class="container page-shell">
        <section id="painel">
            <div class="page-heading">
                <h2><i class="bi bi-grid-1x2-fill me-2"></i>Painel de Monitoramento</h2>
                <p>Visão geral da gestão escolar.</p>
            </div>

            <div class="status-note">
                <i class="bi bi-plug me-2"></i>
                Interface preparada para integração. Dados reais dependem dos endpoints da API.
            </div>

            <div class="row g-3">
                <div class="col-md-4">
                    <div class="card painel-card">
                        <div class="card-body">
                            <h3 class="card-title">
                                <i class="bi bi-people-fill"></i>Alunos
                            </h3>
                            <div class="painel-numero">—</div>
                            <p class="painel-descricao">Aguardando API</p>
                        </div>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card painel-card">
                        <div class="card-body">
                            <h3 class="card-title">
                                <i class="bi bi-calendar-check"></i>Frequência
                            </h3>
                            <div class="painel-numero">—</div>
                            <p class="painel-descricao">Aguardando API</p>
                        </div>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card painel-card">
                        <div class="card-body">
                            <h3 class="card-title">
                                <i class="bi bi-exclamation-triangle-fill"></i>Alertas
                            </h3>
                            <div class="painel-numero">—</div>
                            <p class="painel-descricao">Aguardando API</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/layout.js"></script>
</body>
</html>
