<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Alterar senha | EduAlerta</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <link href="css/style.css" rel="stylesheet">
</head>

<body class="login-page" hidden>

  <main class="card login-card">

    <div class="login-icon">
      <i class="bi bi-shield-lock-fill"></i>
    </div>

    <div class="login-brand">EduAlerta</div>

    <p class="login-subtitle mt-2 mb-4">
      Segurança da sua conta
    </p>

    <h1 class="h4 fw-bold mb-2">
      Altere sua senha
    </h1>

    <p class="login-subtitle mb-4">
      Por segurança, você precisa cadastrar uma nova senha antes de acessar o sistema.
    </p>

    <form id="formAlterarSenha">

      <div class="mb-3 text-start">

        <label for="novaSenha" class="form-label">
          Nova senha
        </label>

        <input id="novaSenha" class="form-control" type="password" autocomplete="new-password" minlength="8"
          maxlength="72" required placeholder="Digite sua nova senha">

      </div>

      <div class="mb-4 text-start">

        <label for="confirmarSenha" class="form-label">
          Confirmar nova senha
        </label>

        <input id="confirmarSenha" class="form-control" type="password" autocomplete="new-password" minlength="8"
          maxlength="72" required placeholder="Digite novamente sua senha">

      </div>

      <p id="mensagemSenha" class="login-error" role="alert" aria-live="polite"></p>

      <button id="btnAlterarSenha" type="submit" class="btn btn-primary w-100">
        <i class="bi bi-check-circle me-2"></i>
        Alterar senha
      </button>

    </form>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/alterar-senha.js"></script>

</body>

</html>
