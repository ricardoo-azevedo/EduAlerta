
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Alunos | EduAlerta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body hidden>
    <div id="cabecalho"></div>
    <div id="navegacao"></div>

    <main class="container page-shell">
        <section>
            <div class="page-heading">
                <h2><i class="bi bi-people-fill me-2"></i>Gestão de Alunos</h2>
                <p>Cadastre, consulte e atualize os alunos da instituição.</p>
            </div>

            <div id="mensagem" role="status" aria-live="polite"></div>

            <div class="card mb-4">
                <div class="card-body">
                    <h3 id="tituloFormulario" class="h5 fw-bold mb-3">Cadastrar aluno</h3>

                    <form id="formCadastro">
                        <div class="row g-3">
                            <div class="col-md-7">
                                <label class="form-label" for="nome">Nome completo</label>
                                <input class="form-control" id="nome" maxlength="150" required>
                            </div>
                            <div class="col-md-5">
                                <label class="form-label" for="dataNascimento">Data de nascimento</label>
                                <input class="form-control" id="dataNascimento" type="date" required>
                            </div>
                        </div>

                        <div class="d-flex gap-2 mt-3">
                            <button id="salvar" class="btn btn-primary" type="submit">
                                <i class="bi bi-check-circle me-1"></i>Salvar
                            </button>
                            <button id="cancelar" class="btn btn-outline-secondary" type="button" hidden>
                                Cancelar edição
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="card">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center gap-2 flex-wrap mb-3">
                        <h3 class="h5 fw-bold mb-0">Alunos cadastrados</h3>
                        <button id="atualizar" class="btn btn-outline-primary btn-sm" type="button">
                            <i class="bi bi-arrow-clockwise me-1"></i>Atualizar
                        </button>
                    </div>

                    <input id="pesquisa" class="form-control mb-3" type="search" placeholder="Pesquisar aluno">

                    <div class="table-responsive">
                        <table class="table align-middle">
                            <thead>
                                <tr>
                                    <th>Nome</th>
                                    <th>Nascimento</th>
                                    <th>Situação</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>
                            <tbody id="registros">
                                <tr><td colspan="4">Carregando...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/gestao-escolar.js"></script>
</body>
</html>
